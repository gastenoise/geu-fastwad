name: Bug Report
description: Report a bug, crash, or unexpected behavior in fastwad.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix the problem.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command or C++ code used to reproduce the issue.
      placeholder: |
        1. Run 'fastwad build ./input ./out.wad ...'
        2. Inspect output...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / Other)
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fastwad Version
      description: Run `fastwad --version` to check.
      placeholder: "1.0.0"
    validations:
      required: false
