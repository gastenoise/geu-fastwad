name: Continuous Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (MSVC)"
            os: windows-latest
            c_compiler: cl
            cxx_compiler: cl
            build_type: Release

          - name: "Linux (GCC)"
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
            build_type: Release

          - name: "Linux (Clang)"
            os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++
            build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Configure CMake
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFASTWAD_BUILD_TESTS=ON

      - name: Build fastwad
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run E2E Test Suite (CTest)
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --verbose

      - name: Verify CLI Functionality
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="./build/${{ matrix.build_type }}/fastwad.exe"
            TEST_EXE="./build/${{ matrix.build_type }}/fastwad_tests.exe"
          else
            EXE="./build/fastwad"
            TEST_EXE="./build/fastwad_tests"
          fi

          # Verify version & help
          $EXE --version
          $EXE --help

          # Test showcase generator
          $TEST_EXE --generate-showcase _site_ci
          test -f _site_ci/index.html
          echo "CI Verification Passed Successfully!"
